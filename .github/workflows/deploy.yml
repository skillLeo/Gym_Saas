name: Deploy — My EXtreme Trainer

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy Laravel backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Deploy Laravel over SSH ──────────────────────────────────────
      #
      # The Next.js build/rsync steps that used to sit here have been removed.
      # They uploaded `frontend/out/`, which only exists for a STATIC EXPORT,
      # and this app can no longer be exported statically: it uses Next
      # middleware (src/proxy.ts) and has dynamic routes with no
      # generateStaticParams (/social/[username], /recipes/[recipeId],
      # /videos/[videoId], /resources/[resourceId], /admin/users/[userId] and
      # both coaching-portal routes). `npm run build` therefore produces
      # `.next/`, never `out/`, and the rsync step failed on a missing source —
      # which also meant this Laravel step never ran.
      #
      # PHP: the server's default CLI php is 8.2, but composer.json requires
      # >= 8.3, so bare `composer install` and `php artisan` abort with
      # "Your Composer dependencies require a PHP version >= 8.3.0".
      # Everything below is pinned to the 8.3 binary explicitly.
      - name: Deploy Laravel backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            PHP=/opt/alt/php83/usr/bin/php
            cd /home/u290685119/domains/gyms.skillleo.com/public_html

            echo "==> PHP version in use..."
            $PHP -v | head -1

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing PHP dependencies..."
            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Running migrations..."
            $PHP artisan migrate --force

            echo "==> Linking public storage..."
            $PHP artisan storage:link || true

            echo "==> Clearing and caching Laravel..."
            $PHP artisan config:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            echo "==> Permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "==> Deployed successfully!"
