name: Deploy — My EXtreme Trainer

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy (Laravel + Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Frontend: build HERE, because the server cannot ──────────────
      #
      # Building on the host fails outright:
      #     Error: EAGAIN { code: 'ERR_WORKER_INIT_FAILED' }
      # The shared plan will not let `next build` spawn worker threads. A GitHub
      # runner has no such limit, so the build happens here and only the output
      # is shipped.
      #
      # This replaces the old `frontend/out/` rsync, which could never have
      # worked: `out/` only exists for a STATIC EXPORT, and this app cannot be
      # exported statically — it uses Next middleware (src/proxy.ts) and has
      # seven dynamic routes with no generateStaticParams. `npm run build`
      # produces `.next/`, so the step failed on a missing source every run,
      # which also stopped the Laravel deploy below from ever executing.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          # Deliberately NOT named NEXT_PUBLIC_API_URL.
          #
          # An unset secret expands to an empty string, and GitHub still puts the
          # variable into the environment. Next's env loader skips any key
          # already present in process.env — an empty value counts as present —
          # so `.env.production` was ignored and the bundle was built with no API
          # origin at all. Verified locally: `NEXT_PUBLIC_API_URL="" npm run
          # build` exits 0 and produces zero chunks containing the domain. That
          # is what failed this step twice, with a green build underneath it.
          #
          # Exported below only when actually set, so an absent secret leaves the
          # committed file in charge.
          API_URL_OVERRIDE: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -e
          if [ -n "$API_URL_OVERRIDE" ]; then
            export NEXT_PUBLIC_API_URL="$API_URL_OVERRIDE"
            echo "using the NEXT_PUBLIC_API_URL secret"
          else
            echo "no secret set — using frontend/.env.production"
          fi
          npm run build

          # Verify the ARTEFACT, not the configuration. NEXT_PUBLIC_* values are
          # inlined at build time, so the only thing that matters is what ended
          # up in the bundle — whichever source it came from. Checking the input
          # instead is what made this step fail while the build itself was fine.
          echo "--- verifying the compiled bundle ---"
          if grep -rql "localhost:" .next/static/chunks/; then
            echo "FAIL: the bundle still points at localhost."
            grep -rl "localhost:" .next/static/chunks/ | head -3
            exit 1
          fi
          if ! grep -rql "gyms.skillleo.com" .next/static/chunks/; then
            echo "FAIL: the production API origin is not in the bundle — it would call nothing."
            exit 1
          fi
          echo "OK: bundle targets gyms.skillleo.com, no localhost references."

      # `.next/cache` and `.next/dev` are build/dev scratch space, not runtime
      # artefacts — 3.2GB of the former on a local build. Ship neither.
      # Packaged into the workspace root, so the upload `source` is a simple
      # relative path — scp-action's strip_components behaviour on absolute
      # paths like /tmp is easy to get subtly wrong.
      - name: Package the build
        working-directory: frontend
        run: |
          tar czf "$GITHUB_WORKSPACE/next-build.tar.gz" \
            --exclude='.next/cache' --exclude='.next/dev' --exclude='.next/trace' .next
          ls -lh "$GITHUB_WORKSPACE/next-build.tar.gz"

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: next-build.tar.gz
          target: /home/u290685119/

      # ── Deploy both halves over SSH ──────────────────────────────────
      #
      # PHP: the server's default CLI php is 8.2 but composer.json requires
      # >= 8.3, so a bare `composer install` or `php artisan` aborts with
      # "Your Composer dependencies require a PHP version >= 8.3.0".
      # Everything below is pinned to the 8.3 binary explicitly.
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            PHP=/opt/alt/php83/usr/bin/php
            NODE=/opt/alt/alt-nodejs22/root/usr/bin/node
            APP=/home/u290685119/domains/gyms.skillleo.com/public_html
            cd $APP

            echo "==> PHP in use..."
            $PHP -v | head -1

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing PHP dependencies..."
            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || true
            # Composer's post-install script calls package:discover through
            # Symfony Process, and proc_open is in this host's
            # disable_functions — so the install succeeds but the script fails.
            # Run discovery directly, which needs no subprocess.
            $PHP artisan package:discover --ansi

            echo "==> Migrations..."
            $PHP artisan migrate --force

            echo "==> Unpacking the frontend build..."
            cd $APP/frontend
            # Unpack beside the live build and only swap once the new one is
            # verified. The previous version deleted .next BEFORE extracting, so
            # a truncated or missing tarball would have left the site with no
            # frontend at all and no way back without another deploy.
            rm -rf .next.incoming
            mkdir -p .next.incoming
            tar xzf /home/u290685119/next-build.tar.gz -C .next.incoming
            if [ ! -f .next.incoming/.next/BUILD_ID ]; then
              echo "FAIL: unpacked build has no BUILD_ID — keeping the current one."
              rm -rf .next.incoming
              exit 1
            fi
            rm -rf .next.old
            [ -d .next ] && mv .next .next.old
            mv .next.incoming/.next .next
            rm -rf .next.incoming .next.old
            # next-static is a plain COPY of .next/static served straight off
            # disk by .htaccess. It MUST be refreshed on every deploy: each
            # build produces new content-hashed chunk filenames, and a stale
            # copy means every chunk 404s and no page hydrates.
            rm -rf next-static
            cp -r .next/static next-static
            echo "BUILD_ID: $(cat .next/BUILD_ID)"

            echo "==> Restarting Next.js..."
            # No process manager on this plan: no systemd, no pm2. The server
            # runs detached and is kept alive by next-keepalive.sh from cron.
            pkill -f "dist/bin/next" || true
            sleep 3
            cd $APP/frontend
            NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 \
              setsid nohup $NODE node_modules/next/dist/bin/next start -p 3210 -H 127.0.0.1 \
              >> /home/u290685119/next.log 2>&1 < /dev/null &
            sleep 12
            curl -s -o /dev/null -w "next on 3210: %{http_code}\n" --max-time 15 http://127.0.0.1:3210/

            echo "==> Caching Laravel config..."
            cd $APP
            $PHP artisan config:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            echo "==> Permissions..."
            chmod -R 775 storage bootstrap/cache

            rm -f /home/u290685119/next-build.tar.gz
            echo "==> Deployed."
