name: Deploy — My EXtreme Trainer

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy (Laravel + Next.js)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build Next.js static export ──────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (static export)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # ── 3. Upload Next.js build to server via rsync ──────────────────
      - name: Upload static frontend to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.htaccess' --exclude='index.php' --exclude='storage'
          path: frontend/out/
          remote_path: /home/u290685119/domains/gyms.skillleo.com/public_html/frontend/out/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_password: ${{ secrets.SSH_PASSWORD }}

      # ── 4. Deploy Laravel via SSH ────────────────────────────────────
      - name: Deploy Laravel backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/u290685119/domains/gyms.skillleo.com/public_html

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Running migrations..."
            php artisan migrate --force

            echo "==> Clearing and caching Laravel..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "==> Deployed successfully!"
