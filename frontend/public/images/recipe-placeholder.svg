  <g fill="none" stroke="#D6D3D1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="196" r="72"/>
    <path d="M246 196a54 54 0 0 1 108 0"/>
    <path d="M232 262h136"/>
  </g>
  <text x="300" y="316" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="22" fill="#A8A29E" text-anchor="middle">No photo yet</text>
</svg>
