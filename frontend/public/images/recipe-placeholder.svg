<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="No photo for this recipe">
  <!-- Neutral placeholder for a recipe with no usable photo. Deliberately a
       plain graphic rather than a stock food photograph: a picture of someone
       else's food presented as this recipe would be inventing content. -->
